<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c14">
<title>LIEDAR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="LIEDAR">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root {
  --bg:#080c14; --surface:#0f1623; --surface2:#162030;
  --border:#1c2d42; --border2:#243552;
  --text:#e2e8f0; --muted:#4a6080; --muted2:#7a98b8; --accent:#3b82f6;
  --safe:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --font:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:-webkit-fill-available;}
body{
  min-height:100vh;min-height:-webkit-fill-available;
  background:var(--bg);color:var(--text);font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 40px;overflow-x:hidden;
}

/* ── AUTH ── */
#authOverlay{position:fixed;inset:0;background:#080c14;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;}
.auth-logo{text-align:center;margin-bottom:22px;}
.auth-wordmark{font-size:30px;font-weight:900;font-family:var(--mono);letter-spacing:2px;background:linear-gradient(90deg,#60a5fa,#e2e8f0,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-sub-text{font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:2px;}
.auth-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;font-family:var(--font);}
.auth-tab.active{background:var(--surface);color:var(--text);}
.auth-field{margin-bottom:12px;}
.auth-label{font-size:10px;color:var(--muted);margin-bottom:5px;display:block;font-family:var(--mono);letter-spacing:1px;}
.auth-input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border 0.2s;}
.auth-input:focus{border-color:var(--accent);}
.auth-remember{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-size:12px;color:var(--muted);cursor:pointer;}
.auth-terms{display:flex;align-items:flex-start;gap:8px;margin:12px 0;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.auth-terms.error{border-color:var(--danger);}
.auth-terms input{margin-top:2px;flex-shrink:0;accent-color:var(--accent);width:16px;height:16px;cursor:pointer;}
.auth-terms-text{font-size:11px;color:var(--muted);line-height:1.5;}
.auth-terms-text a{color:var(--accent);text-decoration:underline;}
.auth-btn{width:100%;padding:13px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:6px;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
.auth-divider-line{flex:1;height:1px;background:var(--border);}
.auth-divider-text{font-size:10px;color:var(--muted);}
.auth-google-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:9px;}
.auth-google-btn:hover{background:var(--surface2);}
.auth-forgot{text-align:center;margin-top:12px;}
.auth-forgot a{font-size:11px;color:var(--accent);cursor:pointer;}
.auth-msg{font-size:11px;color:var(--danger);margin-top:8px;text-align:center;display:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-wordmark">LIEDAR</div>
      <div class="auth-sub-text">VOICE ANALYSIS</div>
    </div>
    
    <!-- Language Selector -->
    <div style="display:flex;justify-content:center;gap:8px;margin-bottom:20px;direction:ltr;">
      <button id="authLangEn" onclick="setAuthLang('en')" style="padding:5px 14px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;font-family:var(--font);">English</button>
      <button id="authLangHe" onclick="setAuthLang('he')" style="padding:5px 14px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;font-family:var(--font);">עברית</button>
      <button id="authLangAr" onclick="setAuthLang('ar')" style="padding:5px 14px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;font-family:var(--font);">العربية</button>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin" onclick="switchAuthTab('login')" data-key="authTabLogin">Login</button>
      <button class="auth-tab" id="authTabRegister" onclick="switchAuthTab('register')" data-key="authTabRegister">Register</button>
    </div>
    
    <!-- LOGIN -->
    <div id="authLogin">
      <div class="auth-field">
        <label class="auth-label" data-key="authEmailLabel">Email</label>
        <input class="auth-input" id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label class="auth-label" data-key="authPassLabel">Password</label>
        <input class="auth-input" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <label class="auth-remember">
        <input type="checkbox" id="rememberMe">
        <span data-key="rememberMeLabel">Remember me</span>
      </label>
      <button class="auth-btn" id="loginBtn" onclick="doLogin()" data-key="authLoginBtn">Sign In</button>
      <div class="auth-forgot"><a onclick="switchAuthTab('forgot')" data-key="authForgotLink">Forgot password?</a></div>
    </div>
    
    <!-- REGISTER -->
    <div id="authRegister" style="display:none;">
      <div class="auth-field">
        <label class="auth-label" data-key="authEmailLabel">Email</label>
        <input class="auth-input" id="regEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label class="auth-label" data-key="authPassLabel">Password</label>
        <input class="auth-input" id="regPass" type="password" autocomplete="new-password" placeholder="••••••">
      </div>
      <div class="auth-field">
        <label class="auth-label" data-key="authPassConfirmLabel">Confirm Password</label>
        <input class="auth-input" id="regPassConfirm" type="password" autocomplete="new-password" placeholder="••••••">
      </div>
      <button class="auth-btn" id="regBtn" onclick="doRegister()" data-key="authRegisterBtn">Register</button>
    </div>

    <!-- TERMS CHECKBOX -->
    <div class="auth-terms" id="termsBox">
      <input type="checkbox" id="termsCheck" onchange="clearTermsError()">
      <div class="auth-terms-text">
        <span data-key="authTermsPrefix">I have read and agree to the </span>
        <a id="termsLink" href="https://liedar.store/terms.html?lang=en" target="_blank" data-key="authTermsLink">Terms of Use</a>
        <span data-key="authTermsAnd"> and </span>
        <a id="privacyLink" href="https://liedar.store/privacy.html?lang=en" target="_blank" data-key="authPrivacyLink">Privacy Policy</a>
      </div>
    </div>

    <!-- GOOGLE LOGIN / REGISTER -->
    <div class="auth-divider">
      <div class="auth-divider-line"></div>
      <div class="auth-divider-text" data-key="authOrText">OR</div>
      <div class="auth-divider-line"></div>
    </div>

    <button class="auth-google-btn" onclick="doGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span data-key="authGoogleBtn">Continue with Google</span>
    </button>

    <div class="auth-msg" id="authErrorMsg"></div>
  </div>
</div>

<script>
// ── TRANSLATIONS OBJECT ──
const T = {
  en: {
    authTabLogin: 'Login',
    authTabRegister: 'Register',
    authEmailLabel: 'Email',
    authPassLabel: 'Password',
    authPassConfirmLabel: 'Confirm Password',
    rememberMeLabel: 'Remember me',
    authLoginBtn: 'Sign In',
    authRegisterBtn: 'Register',
    authForgotLink: 'Forgot password?',
    authTermsPrefix: 'I have read and agree to the ',
    authTermsLink: 'Terms of Use',
    authTermsAnd: ' and ',
    authPrivacyLink: 'Privacy Policy',
    authOrText: 'OR',
    authGoogleBtn: 'Continue with Google',
    mustAcceptTerms: 'You must accept the Terms and Privacy Policy to continue.'
  },
  he: {
    authTabLogin: 'כניסה',
    authTabRegister: 'הרשמה',
    authEmailLabel: 'אימייל',
    authPassLabel: 'סיסמה',
    authPassConfirmLabel: 'אימות סיסמה',
    rememberMeLabel: 'זכור אותי',
    authLoginBtn: 'כניסה',
    authRegisterBtn: 'הרשמה',
    authForgotLink: 'שכחתי סיסמה',
    authTermsPrefix: 'קראתי ואני מסכימ/ה ל',
    authTermsLink: 'תנאי השימוש',
    authTermsAnd: ' ו',
    authPrivacyLink: 'מדיניות הפרטיות',
    authOrText: 'או',
    authGoogleBtn: 'המשך עם Google',
    mustAcceptTerms: 'יש לאשר את תנאי השימוש ומדיניות הפרטיות כדי להמשיך.'
  },
  ar: {
    authTabLogin: 'دخول',
    authTabRegister: 'تسجيل',
    authEmailLabel: 'البريد الإلكتروني',
    authPassLabel: 'كلمة المرور',
    authPassConfirmLabel: 'تأكيد كلمة المرور',
    rememberMeLabel: 'تذكّرني',
    authLoginBtn: 'دخول',
    authRegisterBtn: 'تسجيل',
    authForgotLink: 'نسيت كلمة المرور؟',
    authTermsPrefix: 'قرأت ואوافق على ',
    authTermsLink: 'شروط الاستخدام',
    authTermsAnd: ' و',
    authPrivacyLink: 'سياسة الخصوصية',
    authOrText: 'أو',
    authGoogleBtn: 'المتابعة باستخدام Google',
    mustAcceptTerms: 'يجب قبول شروط الاستخدام وسياسة الخصوصية للمتابعة.'
  }
};

// ברירת מחדל: אנגלית (en) במידה ואין הגדרה שמורה
let lang = localStorage.getItem('liedar_lang') || 'en';

function setAuthLang(l) {
  lang = l;
  localStorage.setItem('liedar_lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'he' || l === 'ar') ? 'rtl' : 'ltr';
  
  // עדכון עיצוב כפתורי השפה
  ['En', 'He', 'Ar'].forEach(code => {
    const btn = document.getElementById('authLang' + code);
    const isCurrent = l === code.toLowerCase();
    btn.style.background = isCurrent ? 'var(--accent)' : 'transparent';
    btn.style.color = isCurrent ? '#fff' : 'var(--muted2)';
    btn.style.fontWeight = isCurrent ? '700' : '400';
    btn.style.borderColor = isCurrent ? 'var(--accent)' : 'var(--border2)';
  });

  // עדכון הטקסטים במסך
  document.querySelectorAll('[data-key]').forEach(el => {
    const k = el.getAttribute('data-key');
    if (T[l] && T[l][k]) {
      el.textContent = T[l][k];
    }
  });

  // עדכון הקישורים כך שיפתחו בשפה הנבחרת בעמודים הטרגטים
  document.getElementById('termsLink').href = `https://liedar.store/terms.html?lang=${l}`;
  document.getElementById('privacyLink').href = `https://liedar.store/privacy.html?lang=${l}`;
}

function switchAuthTab(tab) {
  document.getElementById('authLogin').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('authRegister').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('authTabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('authTabRegister').classList.toggle('active', tab === 'register');
  clearTermsError();
}

function validateTerms() {
  const isChecked = document.getElementById('termsCheck').checked;
  const termsBox = document.getElementById('termsBox');
  const errorMsg = document.getElementById('authErrorMsg');

  if (!isChecked) {
    termsBox.classList.add('error');
    errorMsg.textContent = T[lang].mustAcceptTerms;
    errorMsg.style.display = 'block';
    return false;
  }
  
  clearTermsError();
  return true;
}

function clearTermsError() {
  const termsBox = document.getElementById('termsBox');
  const errorMsg = document.getElementById('authErrorMsg');
  termsBox.classList.remove('error');
  errorMsg.style.display = 'none';
}

function doRegister() {
  if (!validateTerms()) return;
  const email = document.getElementById('regEmail').value;
  const pass = document.getElementById('regPass').value;
  const passConfirm = document.getElementById('regPassConfirm').value;

  if (!email || !pass) return;
  if (pass !== passConfirm) {
    alert(lang === 'he' ? 'הסיסמאות אינן תואמות' : lang === 'ar' ? 'كلمات المرور غير متطابقة' : 'Passwords do not match');
    return;
  }
  console.log('Registering user:', email);
}

function doGoogleAuth() {
  if (!validateTerms()) return;
  console.log('Initiating Google OAuth...');
}

function doLogin() {
  if (!validateTerms()) return;
  const email = document.getElementById('loginEmail').value;
  console.log('Logging in user:', email);
}

// הפעלה ראשונית
setAuthLang(lang);
</script>
</body>
</html>
